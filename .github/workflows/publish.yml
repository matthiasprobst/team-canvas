name: Publish verified images
on:
  workflow_dispatch:
    inputs:
      verification_run:
        description: Successful Verify run ID from the default branch (artifact retained for 14 days)
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    # Configure required reviewers for this environment in repository settings.
    environment: production-release
    steps:
      - name: Validate completed verification run and download its exact images
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RUN: ${{ inputs.verification_run }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$VERIFY_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$REPOSITORY/actions/runs/$VERIFY_RUN" > run.json
          workflow_id=$(gh api "repos/$REPOSITORY/actions/workflows/verify.yml" --jq .id)
          jq -e --arg branch "$DEFAULT_BRANCH" --argjson workflow "$workflow_id" \
            '.status == "completed" and .conclusion == "success" and .event == "push" and .head_branch == $branch and .workflow_id == $workflow' run.json
          gh run download "$VERIFY_RUN" --repo "$REPOSITORY" --name verified-runtime-images --dir verified
          cd verified
          sha256sum --check SHA256SUMS
          test "$(cat commit.txt)" = "$(jq -r .head_sha ../run.json)"
          docker load --input images.tar.gz
          for component in backend frontend; do
            expected=$(jq -r --arg tag "team-canvas-$component:latest" '.[] | select(.RepoTags | index($tag)) | .Id' images.json)
            test -n "$expected"
            test "$(docker image inspect "team-canvas-$component" --format '{{.Id}}')" = "$expected"
          done
      - name: Recheck backend before publication
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: image
          image-ref: team-canvas-backend
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Recheck frontend before publication
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: image
          image-ref: team-canvas-frontend
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Publish without rebuilding and record registry digests
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          commit=$(cat verified/commit.txt)
          mkdir published
          cp run.json verified/images.json verified/commit.txt verified/*-sbom.json verified/*-scan.json published/
          for component in backend frontend; do
            repository="ghcr.io/${REPOSITORY,,}/$component"
            docker tag "team-canvas-$component" "$repository:$commit"
            docker push "$repository:$commit"
            docker image inspect "team-canvas-$component" | jq -er --arg prefix "$repository@sha256:" \
              '.[0].RepoDigests[] | select(startswith($prefix))' > "published/$component-image.txt"
          done
          cd published
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-image-identities
          path: published/
          if-no-files-found: error
