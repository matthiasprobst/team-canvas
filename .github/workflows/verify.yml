name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: board
          POSTGRES_USER: board
          POSTGRES_PASSWORD: board-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U board -d board"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_USER: board
      DB_PASSWORD: board-test
      JDBC_URL: jdbc:postgresql://localhost:5432/board
      TEAM_CANVAS_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/board
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.1
      - run: npm ci --prefix frontend
      - run: npm run test:sync --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run inventory --prefix frontend
      - run: mvn -B verify
        working-directory: backend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.1
      - run: npm ci --prefix frontend
      - run: node frontend/node_modules/playwright/cli.js install --with-deps chromium
      - run: docker build -t team-canvas-backend ./backend
      - run: docker build -t team-canvas-frontend -f frontend/Dockerfile .
      - run: docker run --rm team-canvas-frontend caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker run --rm --user 1001:1001 --cap-drop=ALL --security-opt=no-new-privileges team-canvas-frontend caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify complete Compose stack
        env:
          BASE_URL: http://localhost:8088
        run: |
          printf 'DB_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
          docker compose build
          docker compose up -d --wait db keycloak
          docker compose run --rm --no-deps backend migrate
          docker compose up -d --wait --wait-timeout 300
          node tests/smoke.mjs
          npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: test-results/
      - name: Compose output
        if: failure()
        run: docker compose logs --tail=100
      - name: Scan source dependencies and secrets
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          skip-dirs: frontend/node_modules,frontend/dist,backend/target,.git,test-results
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: npm run inventory --prefix frontend
      - name: Generate frontend source SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: frontend
          format: cyclonedx
          output: frontend-sbom.json
          skip-dirs: frontend/node_modules,frontend/dist
      - name: Generate backend image SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: team-canvas-backend
          format: cyclonedx
          output: backend-sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dependency-inventory
          path: |
            frontend-sbom.json
            backend-sbom.json
            frontend/dist/dependency-inventory.json
      - name: Scan backend dependencies and operating system
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: team-canvas-backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend dependencies and operating system
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: team-canvas-frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
