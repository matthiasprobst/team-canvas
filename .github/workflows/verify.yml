name: Verify
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: board
          POSTGRES_USER: board
          POSTGRES_PASSWORD: board-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U board -d board"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_USER: board
      DB_PASSWORD: board-test
      JDBC_URL: jdbc:postgresql://localhost:5432/board
      TEAM_CANVAS_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/board
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.1
      - run: npm ci --prefix frontend
      - run: npm run test:sync --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run inventory --prefix frontend
      - run: mvn -B verify
        working-directory: backend
  containers:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: team-canvas-ci-readiness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.1
      - run: npm ci --prefix frontend
      - run: node frontend/node_modules/playwright/cli.js install --with-deps chromium
      - run: docker build -t team-canvas-backend ./backend
      - run: docker build -t team-canvas-frontend -f frontend/Dockerfile .
      - run: docker run --rm team-canvas-frontend caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker run --rm --user 1001:1001 --cap-drop=ALL --security-opt=no-new-privileges team-canvas-frontend caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify complete Compose stack
        env:
          BASE_URL: http://localhost:8088
        run: |
          printf 'DB_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
          cat > /tmp/team-canvas-ci-images.yaml <<'IMAGES'
          services:
            backend:
              image: team-canvas-backend
            frontend:
              image: team-canvas-frontend
          IMAGES
          export COMPOSE_FILE=docker-compose.yml:/tmp/team-canvas-ci-images.yaml
          # Exercise the same automatic migration path as development up --build.
          docker compose up --no-build -d --wait --wait-timeout 300
          node tests/smoke.mjs
          npm run test:e2e --prefix frontend
          RECOVERY_CONFIRM=disposable RECOVERY_COMPOSE_PROJECT=team-canvas-ci-readiness node tests/recovery.mjs | tee recovery-evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: recovery-evidence
          path: recovery-evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: test-results/
      - name: Compose output
        if: failure()
        run: docker compose logs --tail=100
      - name: Scan source dependencies and secrets
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          skip-dirs: frontend/node_modules,frontend/dist,backend/target,.git,test-results
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - run: npm run inventory --prefix frontend
      - name: Generate frontend source SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: frontend
          format: cyclonedx
          output: frontend-sbom.json
          skip-dirs: frontend/node_modules,frontend/dist
      - name: Generate backend image SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: team-canvas-backend
          scan-type: image
          format: cyclonedx
          output: backend-sbom.json
      - name: Generate frontend runtime image SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: image
          image-ref: team-canvas-frontend
          format: cyclonedx
          output: frontend-runtime-sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dependency-inventory
          path: |
            frontend-sbom.json
            backend-sbom.json
            frontend-runtime-sbom.json
            frontend/dist/dependency-inventory.json
      - name: Record all backend dependency and operating system findings
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: image
          image-ref: team-canvas-backend
          scanners: vuln,secret
          format: json
          output: backend-scan.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
      - name: Record all frontend dependency and operating system findings
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: image
          image-ref: team-canvas-frontend
          scanners: vuln,secret
          format: json
          output: frontend-scan.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-security-reports
          path: |
            backend-scan.json
            frontend-scan.json
          retention-days: 14
      - name: Reject HIGH and CRITICAL runtime findings including unfixed issues
        run: |
          for report in backend-scan.json frontend-scan.json; do
            trivy convert --severity HIGH,CRITICAL --exit-code 1 --format json --output /dev/null "$report"
          done
      - name: Retain tested images and identity evidence
        env:
          VERIFIED_COMMIT: ${{ github.sha }}
        run: |
          mkdir release-images
          docker image inspect team-canvas-backend team-canvas-frontend > release-images/images.json
          printf '%s\n' "$VERIFIED_COMMIT" > release-images/commit.txt
          docker save team-canvas-backend team-canvas-frontend | gzip > release-images/images.tar.gz
          cp backend-sbom.json frontend-runtime-sbom.json backend-scan.json frontend-scan.json release-images/
          cd release-images
          sha256sum images.tar.gz images.json commit.txt *-sbom.json *-scan.json > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-runtime-images
          path: release-images/
          retention-days: 14
          if-no-files-found: error
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check supported deployment chart
        run: bash tests/helm/check.sh
