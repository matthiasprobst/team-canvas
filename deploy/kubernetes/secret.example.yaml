# Example only. Provision these keys through your company secret manager.
apiVersion: v1
kind: Secret
metadata: {name: team-canvas}
type: Opaque
stringData:
  JDBC_URL: jdbc:postgresql://postgres.example.internal:5432/board?sslmode=verify-full
  DB_USER: team_canvas
  DB_PASSWORD: REPLACE
  OIDC_ISSUER: https://identity.example.internal/realms/company
  OIDC_CLIENT_ID: team-canvas
  OIDC_CLIENT_SECRET: REPLACE
  OIDC_SESSION_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
