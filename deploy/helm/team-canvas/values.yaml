# Required company settings; credentials are provisioned separately.
images:
  backend: ""
  frontend: ""
existingSecret: ""
migrationSecret: ""
host: ""
tlsSecret: ""
ingressClassName: ""
trustedProxies: ""
databaseCIDR: ""
identityCIDR: ""
limits:
  maxPagesPerCanvas: 10
  maxOwnedCanvasesPerUser: 20
# Render/run migration Job separately while the backend is stopped.
runMigration: false
# Optional internal Prometheus access. Both selectors must be non-empty when enabled.
# This creates a separate NetworkPolicy; /q remains unavailable through Caddy/ingress.
monitoring:
  enabled: false
  namespaceLabels: {}
  podLabels: {}
