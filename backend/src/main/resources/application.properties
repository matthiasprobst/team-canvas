quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:board}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:postgresql://localhost:5432/board}
quarkus.datasource.jdbc.max-size=12
quarkus.flyway.migrate-at-start=${TEAM_CANVAS_MIGRATE_AT_START:true}
quarkus.flyway.validate-at-start=true
quarkus.flyway.clean-disabled=true
quarkus.flyway.validate-at-start.clean-on-validation-error=false
quarkus.http.limits.max-body-size=2M
quarkus.http.cors.enabled=false
quarkus.shutdown.timeout=15s
quarkus.oidc.devservices.enabled=false

# All environments require Keycloak. Compose overrides endpoints for its development provider.
team-canvas.allowed-origins=${TEAM_CANVAS_ALLOWED_ORIGINS:http://localhost:8088}
quarkus.oidc.tenant-enabled=true
quarkus.oidc.application-type=web-app
quarkus.oidc.auth-server-url=${OIDC_ISSUER:}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:}
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.authentication.redirect-path=/api/login
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.authentication.cookie-force-secure=true
quarkus.oidc.token-state-manager.encryption-secret=${OIDC_SESSION_SECRET:}
quarkus.http.auth.permission.board.paths=/api/admin/*,/api/boards,/api/boards/*,/ws/*,/api/login,/api/me,/api/logout,/api/oidc/logout
quarkus.http.auth.permission.board.policy=authenticated

# Only trust forwarding headers from explicitly configured reverse proxies.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.trusted-proxies=${TRUSTED_PROXIES:127.0.0.1}

quarkus.oidc.authentication.scopes=profile,email
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.token.issuer=${OIDC_ISSUER:}
quarkus.oidc.logout.path=/api/oidc/logout
quarkus.oidc.logout.post-logout-path=/login

quarkus.oidc.authentication.state-secret=${OIDC_SESSION_SECRET:}
quarkus.oidc.token.refresh-expired=true

team-canvas.production=${TEAM_CANVAS_PRODUCTION:false}

team-canvas.max-pages=${TEAM_CANVAS_MAX_PAGES:10}
team-canvas.max-owned-canvases=${TEAM_CANVAS_MAX_OWNED_CANVASES:20}
team-canvas.max-connections-per-canvas=${TEAM_CANVAS_MAX_CONNECTIONS_PER_CANVAS:30}

# Only verified client roles from the access token authorize application administration.
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=resource_access/${OIDC_CLIENT_ID:team-canvas}/roles
team-canvas.identity-blocking-secret=${IDENTITY_BLOCKING_SECRET:development-only-identity-blocking-secret}
