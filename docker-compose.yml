services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: board
      POSTGRES_USER: ${DB_USER:-board}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 25
    networks: [internal]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-board}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JDBC_URL: jdbc:postgresql://db:5432/board
      # This Compose stack is local development. Kubernetes requires corporate OIDC.
      TEAM_CANVAS_AUTH_REQUIRED: "false"
      TEAM_CANVAS_HTTP_POLICY: permit
      TEAM_CANVAS_ALLOWED_ORIGINS: http://localhost:${HTTP_PORT:-8088},http://127.0.0.1:${HTTP_PORT:-8088},http://localhost:5173
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/q/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8088}:80"
    depends_on:
      backend: {condition: service_healthy}
    networks: [internal]
networks:
  internal: {}
volumes:
  pgdata: {}
